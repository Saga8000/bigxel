# Render Blueprint for a staging deployment: render.com → New → Blueprint → pick this repo.
databases:
  - name: bigxel-db
    plan: free
    databaseName: bigxel
    user: bigxel_app

services:
  - type: web
    name: bigxel-staging
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: bigxel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENTS_MODE
        value: simulated
      # Same-origin deployment, so CORS only needs the site itself. Update both if you add a custom domain.
      - key: CORS_ORIGINS
        value: https://bigxel-staging.onrender.com
      - key: FRONTEND_URL
        value: https://bigxel-staging.onrender.com
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
      # Integrations: fill these in the Render dashboard (sync: false = never stored in git).
      # Then set PAYMENTS_MODE=razorpay and/or STORAGE_BACKEND=s3.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BigXel Ads <onboarding@resend.dev>
      - key: STORAGE_BACKEND
        value: local
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
