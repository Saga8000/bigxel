# Render Blueprint for a staging deployment: render.com → New → Blueprint → pick this repo.
databases:
  - name: bigxel-db
    plan: free
    databaseName: bigxel
    user: bigxel_app

services:
  - type: web
    name: bigxel-staging
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: bigxel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENTS_MODE
        value: simulated
      # Same-origin deployment, so CORS only needs the site itself. Update both if you add a custom domain.
      - key: CORS_ORIGINS
        value: https://bigxel-staging.onrender.com
      - key: FRONTEND_URL
        value: https://bigxel-staging.onrender.com
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
